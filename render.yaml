services:
  - type: web
    name: healthcare-predictor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && if [ -n "$TRAINING_DATA_PATH" ] && [ -f "$TRAINING_DATA_PATH" ]; then python train_model.py; else echo "No private training data configured; model training skipped"; fi
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-predictor-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: TRAINING_DATA_PATH
        sync: false

databases:
  - name: healthcare-predictor-db
    databaseName: healthcare_predictor
    user: healthcare_predictor
    plan: free
